<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pachisa - 25 Point Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. LOBBY AREA -->
    <div id="lobby-area">
        <h2>Pachisa Multiplayer</h2>
        
        <!-- TOP: Sirf Create Room ka button -->
        <button id="create-room-btn" style="background-color: #27ae60;">Create New Room</button>
        
        <br><br><hr><br>
        
        <!-- BOTTOM: Join Room ka section -->
        <p>Ya doston ka room join karo:</p>
        <input type="text" id="playerName" placeholder="Apna Naam Likho" />
        <input type="text" id="roomIdInput" placeholder="Room ID (e.g. 1234)" />
        <button id="join-room-btn">Join Room</button>
    </div>

    <!-- 2. GAME BOARD (Default hidden) -->
    <div id="game-board" style="display: none;">
        
        <!-- Room ID Display -->
        <div id="room-info">Room ID: <span id="display-room-id"></span></div>

        <div class="top-actions">
            <button id="show-history-btn" class="top-btn history-btn">🕒 Last Round</button>
            <button id="show-score-btn" class="top-btn score-btn">🏆 Scores</button>
        </div>

        <div id="live-scoreboard" class="live-scoreboard"></div>

        <!-- YEH NAYA HISTORY MODAL ADD KAREIN -->
        <div id="history-modal" class="modal" style="display: none;">
            <div class="modal-content" style="max-width: 600px;">
                <span id="close-history">&times;</span>
                <h2>Previous Round Battles</h2>
                <div id="history-content">
                    <p style="text-align: center;">Abhi koi round nahi khela gaya hai.</p>
                </div>
            </div>
        </div>

        <div id="scoreboard-modal" class="modal" style="display: none;">
            <div class="modal-content scoreboard-card">
                <button id="close-score" class="modal-close">&times;</button>
                <div class="scoreboard-heading">
                    <div class="trophy">🏆</div>
                    <div><h2>25 POINTS</h2><p>First player to reach 25 wins</p></div>
                </div>
                <table id="score-table">
                    <thead><tr><th>PLAYER</th><th>POINTS</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Virtual Table (Avatars & Center Deck) -->
        <div id="virtual-table">
            <div class="avatar" id="opp1-avatar">⏳ Wait...</div>
            
            <!-- Center Table jahan cards discard honge -->
            <div id="center-table">
                <div id="deck-visual">🎴 Deck</div>
                <div id="unusable-pile"></div>
            </div>
            
            <div class="avatar" id="opp2-avatar">⏳ Wait...</div>
        </div>

        <!-- ==========================================
     BATTLE ARENA
     ========================================== -->

<div id="battle-arena" style="display: none;">

    <div class="battle-header">

        <div>
            <div class="battle-small-title">
                PACHISA • BATTLE
            </div>

            <h2 id="battle-title">
                SLOT 1
            </h2>
        </div>

        <div class="battle-step">
            <span id="battle-step-number">1</span>
            <small>/ 5</small>
        </div>

    </div>


    <div id="battle-cards">
        <!-- Cards JS se aayenge -->
    </div>


    <div id="battle-winner">
        <!-- Winner JS se aayega -->
    </div>


    <!-- USER CONTROL -->
    <button
        id="battle-next-btn"
        class="battle-next-btn"
        type="button"
    >
        👆 TAP TO REVEAL
    </button>

</div>
        <!-- 5 Slots for the Current Player -->
        <div id="slots-area">
            <div class="slot" id="slot-1" data-slot="1">Slot 1</div>
            <div class="slot" id="slot-2" data-slot="2">Slot 2</div>
            <div class="slot" id="slot-3" data-slot="3">Slot 3</div>
            <div class="slot" id="slot-4" data-slot="4">Slot 4</div>
            <div class="slot" id="slot-5" data-slot="5">Slot 5</div>
        </div>

        <button id="lock-btn" disabled>Lock Cards</button>

        <!-- Current Player's 17 Cards -->
        <div id="player-hand"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <!-- Polyfill for Mobile Touch Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script>
        // Polyfill ko on karna taaki mobile par drag and drop chal sake
        MobileDragDrop.polyfill({
            dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
        });
        
        // Prevent default mobile scrolling when touching cards
        window.addEventListener('touchmove', function() {}, {passive: false});
    </script>
    
    <!-- Aapki existing file yahan rahegi -->
    <script src="game.js"></script>
</body>
</html>
